name: shomei-ssh

services:
  shomei:
    image: "${SHOMEI_IMAGE:-ghcr.io/adrianchifor/shomei:latest}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9443:9443"
    volumes:
      - ./fixtures/ssh/shomei.toml:/etc/shomei/shomei.toml:ro
      - ./fixtures/localhost:/run/shomei-tls:ro
      - ./local/config:/run/shomei:ro
      - state:/var/lib/shomei
    healthcheck:
      test: [CMD, bash, -c, "true </dev/tcp/127.0.0.1/8443"]
      interval: 2s
      timeout: 2s
      retries: 5

  ssh-fixture:
    build: ./fixtures/ssh
    network_mode: "service:shomei"
    depends_on:
      shomei:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run/sshd:mode=0755
    volumes:
      - ./local/ssh/host_key:/fixture/host_key:ro
      - ./local/ssh/authorized_keys:/fixture/authorized_keys:ro
    healthcheck:
      test: [CMD-SHELL, 'ssh-keyscan -T 2 -t ed25519 -p 2222 127.0.0.1 >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  state:
