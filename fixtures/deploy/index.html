<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Deploy service</title>
  <link rel="stylesheet" href="/_shomei/auth.css">
  <script type="module" src="/deploy.js"></script>
  <style>
    button {
      margin-top: 1.5rem;
      border: 1px solid #d77b70;
      border-radius: 0.5rem;
      padding: 0.65rem 1rem;
      background: #653831;
      color: #f6f0ed;
      font: inherit;
      cursor: pointer;
    }
    button:hover:enabled { background: #793e35; }
    button:disabled { cursor: wait; opacity: 0.65; }
  </style>
</head>
<body>
  <main>
    <img class="seal" src="/_shomei/seal.png" alt="" width="90" height="90">
    <h1>Deploy service</h1>
    <button type="button" aria-describedby="status" disabled>Deploy</button>
    <p id="status" role="status"></p>
    <noscript>Enable JavaScript to use your YubiKey.</noscript>
  </main>
</body>
</html>
