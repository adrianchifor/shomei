origin = "https://localhost:8443"
https_bind = "0.0.0.0:8443"
tls_cert = "/etc/shomei/tls.pem"
tls_key = "/etc/shomei/tls-key.pem"
state_dir = "/var/lib/shomei"
identities_file = "/etc/shomei/identities.json"
allow_yubikey_4 = false  # May be enabled for localhost origins.
http_upstream = "http://host.docker.internal:8080"
session_ttl_seconds = 600

# Require fresh approval for these paths and leave other paths public.
# protected_paths = ["/api/deploy"]

# With http_upstream above, this approves POST http://host.docker.internal:8080/api/deploy.
# Enabling this requires fresh approval for HTTP writes.
# [browser_action]
# path = "/api/deploy"
# label = "Deploy service"

[tcp]
bind = "0.0.0.0:9443"
upstream = "host.docker.internal:9000"
# ssh_host = "deploy"
public_port = 9443
cert_ttl_seconds = 300

# Forward proxy. Replace the example DNS and IP ranges with your own.
# [forward]
# TCP and SSH use mTLS on this listener.
# bind = "0.0.0.0:9444"
# public_port = 9444
# cert_ttl_seconds = 300
# HTTP and HTTPS use signed approvals or sessions over TLS. Omit to disable.
# http_bind = "0.0.0.0:9445"

# [forward.scopes.fleet]
# dns_suffixes = ["internal.example.com"]
# cidrs = ["10.42.0.0/16", "fd00:42::/48"]
# ports = [22, 80, 443, 5432]
# HTTP and HTTPS destinations must also match these protocol-specific lists.
# http_ports = [80]
# https_ports = [443]

# Alternative to the scope above. Let the gateway's network policy limit destinations.
# [forward.scopes.unrestricted]
# allow_all = true
# HTTPS CONNECT still uses https_ports, which defaults to [443].

# Use the gateway's MagicDNS origin and TLS certificate, and bind https_bind to its Tailscale IP.
# [tailscale_ssh]
# Optional fixed SSH destination. Omit to let tailnet policy select the permitted hosts.
# target = "deploy.example.ts.net"
# posture_attribute = "custom:shomei_ssh_deploy"
# oauth_client_id = "your-oauth-client-id"
# oauth_client_secret_file = "/etc/shomei/tailscale-oauth-secret"
# socket = "/var/run/tailscale/tailscaled.sock"
# ttl_seconds = 300

[limits]
https_connections = 4096
tcp_connections = 4096
tls_handshakes = 512
http_requests = 8192
auth_workers = 32
pending_challenges = 8192
pending_per_ip = 128
