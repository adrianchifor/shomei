[package]
name = "shomei"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "=1.0.105"
authenticator = { version = "=0.5.0", default-features = false, features = ["crypto_rust"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "=0.23.1"
clap = { version = "=4.6.10", features = ["derive", "env"] }
crypto-glue = "=0.2.2"
http-body = "=1.1.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.13.0", features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "server-auto", "tokio", "service"] }
miniz_oxide = "=0.9.1"
rcgen = { version = "=0.14.10", features = ["x509-parser"] }
ring = "=0.17.14"
rpassword = "=7.5.5"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_cbor_2 = "=0.13.0"
serde_json = "=1.0.154"
subtle = "=2.6.1"
tempfile = "=3.27.0"
time = { version = "=0.3.55", features = ["formatting"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
toml = "=1.2.3"
url = { version = "=2.5.9", features = ["serde"] }
uuid = { version = "=1.29.3", features = ["v4", "serde"] }
webauthn-authenticator-rs = { version = "=0.6.2", default-features = false, features = ["ctap2-management", "usb"] }
webauthn-rs = { version = "=0.6.2", features = ["attestation", "danger-allow-state-serialisation", "danger-credential-internals", "danger-user-presence-only-security-keys"] }
webauthn-rs-proto = "=0.6.2"
webpki-roots = "=1.0.12"
x509-parser = { version = "=0.18.1", features = ["verify"] }
zeroize = "=1.9.2"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[patch.crates-io]
crypto-glue = { git = "https://github.com/kanidm/crypto-glue.git", rev = "a3c634ceca6bf338cc42d20d7c87d7bc771f8441" }
