name: Build and release

on:
  push:
    # Plain version tags only, such as 0.3.0. Each one becomes the latest
    # release and moves the latest image tag, even when it is lower than the
    # newest release.
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.100.0'

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: shomei-linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: shomei-linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: shomei-macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libudev-dev linux-libc-dev pkg-config
      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            release-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
      - name: Test and build
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          SHOMEI_VERSION: ${{ github.ref_name }}
        run: |
          cargo "+$RUST_TOOLCHAIN" test --release --locked --target "$TARGET"
          cargo "+$RUST_TOOLCHAIN" build --release --locked --target "$TARGET"
          mkdir -p dist
          cp "target/$TARGET/release/shomei" "dist/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: shomei-linux-*
          merge-multiple: true
          path: dist
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Smoke-test container images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --target release --load --tag "shomei-smoke:$arch" .
            version=$(docker run --rm --network none --platform "linux/$arch" "shomei-smoke:$arch" --version)
            printf '%s: %s\n' "$arch" "$version"
            if [[ "$version" != "shomei $RELEASE_TAG" ]]; then
              echo "::error::linux/$arch image reports '$version', expected 'shomei $RELEASE_TAG'"
              exit 1
            fi
          done
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: publish
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: shomei-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/shomei-linux-amd64
            dist/shomei-linux-arm64
            dist/shomei-macos-arm64
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          tar -czf dist/shomei-deploy-example.tar.gz \
            compose.deploy.yaml fixtures/deploy/shomei.toml fixtures/deploy/deploy.py \
            fixtures/deploy/index.html fixtures/deploy/deploy.js \
            fixtures/localhost/ca.pem fixtures/localhost/localhost.pem fixtures/localhost/localhost-key.pem
          cd dist
          assets=(shomei-linux-amd64 shomei-linux-arm64 shomei-macos-arm64 shomei-deploy-example.tar.gz)
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/${GH_REPO,,}@$IMAGE_DIGEST"
          notes=$(printf '%s\n\nContainer image for linux/amd64 and linux/arm64\n\n```sh\ndocker pull %s\n```\n' "$RELEASE_TAG" "$image")
          if draft=$(gh release view --json isDraft --jq .isDraft -- "$RELEASE_TAG" 2>/dev/null); then
            if [[ "$draft" == false ]]; then
              exit 0
            fi
          else
            gh release create --verify-tag --draft --title "$RELEASE_TAG" --notes "$notes" -- "$RELEASE_TAG"
          fi
          gh release upload --clobber -- "$RELEASE_TAG" "${assets[@]}" SHA256SUMS
          gh release edit --draft=false --latest -- "$RELEASE_TAG"
