<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shomei</title>
<link rel="stylesheet" href="/_shomei/auth.css">
<script src="/_shomei/auth.js" defer></script>
<main>
  <h1>Sign in with your YubiKey</h1>
  <form>
    <label>Account <input id="account" type="text" autocomplete="username" placeholder="operator" maxlength="64"></label>
    <label hidden>Enrollment token <input id="enrollment-token" type="password" autocomplete="off"></label>
    <button type="submit">Use YubiKey</button>
  </form>
  <p id="status" role="status"></p>
</main>
</html>
