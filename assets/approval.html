<link rel="stylesheet" href="/_shomei/approval.css">
<dialog aria-labelledby="shomei-title" aria-describedby="shomei-status">
  <img src="/_shomei/seal.png" alt="" width="48" height="48">
  <h2 id="shomei-title">Approve with YubiKey</h2>
  <p data-shomei-request></p>
  <p id="shomei-status" role="status">Tap your YubiKey to continue.</p>
  <div class="controls">
    <button type="button" data-shomei-verify hidden>Continue with YubiKey</button>
    <button type="button" data-shomei-cancel>Cancel</button>
  </div>
</dialog>
