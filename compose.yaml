services:
  shomei:
    build: .
    user: "${SHOMEI_UID:-10001}:${SHOMEI_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    environment:
      TOKIO_WORKER_THREADS: "2"
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9443:9443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./local/config:/etc/shomei:ro
      - ./local/state:/var/lib/shomei
