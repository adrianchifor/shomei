# Runs the gateway from the local/ directory next to this file.
#   local/config  mounted read-only at /etc/shomei: shomei.toml, the TLS certificate and key,
#                 and the allowlist
#   local/state   mounted at /var/lib/shomei: signature counters, writable by SHOMEI_UID
# SHOMEI_IMAGE pins a release tag or digest. SHOMEI_UID and SHOMEI_GID default to 10001.
# Both listeners are published on loopback. Change the host addresses to expose them.
services:
  shomei:
    image: "${SHOMEI_IMAGE:-ghcr.io/adrianchifor/shomei:latest}"
    user: "${SHOMEI_UID:-10001}:${SHOMEI_GID:-10001}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9443:9443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./local/config:/etc/shomei:ro
      - ./local/state:/var/lib/shomei
